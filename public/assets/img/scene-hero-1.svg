<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spot" cx="26%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#6E4B2F" stop-opacity=".55"/>
      <stop offset="42%" stop-color="#2A241D" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201C18"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9B98A" stop-opacity=".20"/>
      <stop offset="60%" stop-color="#C9A878" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#C9A878" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332C25"/>
      <stop offset="100%" stop-color="#1B1713"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C98F" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#E0B87E" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#171412"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <rect y="640" width="1600" height="260" fill="url(#floor)"/>
  <rect y="632" width="1600" height="7" fill="#4A3420" opacity=".5"/>

  <polygon points="150,60 660,60 1150,640 560,640" fill="url(#beam)"/>
  <line x1="150" y1="900" x2="150" y2="640" stroke="#000" stroke-opacity=".25" stroke-width="3"/>

  <g transform="translate(880 470)">
    <!-- sofa silhouette -->
    <g>
      <path d="M0 130 C0 92 22 66 70 62 L70 40 C70 26 82 14 96 14 L330 14 C344 14 356 26 356 40 L356 62 C404 66 426 92 426 130 L426 158 L0 158 Z" fill="url(#sofa)"/>
      <path d="M70 62 L70 40 C70 26 82 14 96 14 L330 14 C344 14 356 26 356 40 L356 62" fill="none" stroke="#3E352B" stroke-width="2"/>
      <path d="M96 158 L96 130 C96 100 100 84 110 74" fill="none" stroke="#4A3F31" stroke-width="2" opacity=".8"/>
      <rect x="0" y="158" width="426" height="16" rx="3" fill="#1B1713"/>
      <path d="M96 232 L102 158 M330 232 L324 158" stroke="#2A231C" stroke-width="9" stroke-linecap="round"/>
      <path d="M20 90 L64 74 L64 158 L20 158 Z" fill="#241F19"/>
      <path d="M362 90 L406 74 L406 158 L362 158 Z" fill="#241F19"/>
      <ellipse cx="213" cy="178" rx="200" ry="14" fill="#000" opacity=".4"/>
    </g>
  </g>

  <g transform="translate(206 520)">
    <!-- floor lamp -->
    <line x1="34" y1="0" x2="34" y2="180" stroke="#22201C" stroke-width="5"/>
    <g>
      <path d="M6 0 L62 0 L50 18 L18 18 Z" fill="#C9A878" fill-opacity=".9"/>
      <path d="M20 18 L48 18 L48 24 L20 24 Z" fill="#8A6B42"/>
    </g>
    <ellipse cx="34" cy="184" rx="26" ry="6" fill="#000" opacity=".45"/>
  </g>

  <circle cx="240" cy="520" r="190" fill="url(#lamp)"/>

  <g transform="translate(1050 560)">
    <!-- side table -->
    <rect x="0" y="18" width="132" height="9" rx="2" fill="#1F1B17"/>
    <line x1="20" y1="27" x2="20" y2="86" stroke="#1F1B17" stroke-width="6"/>
    <line x1="112" y1="27" x2="112" y2="86" stroke="#1F1B17" stroke-width="6"/>
    <ellipse cx="66" cy="90" rx="60" ry="8" fill="#000" opacity=".4"/>
  </g>

  <rect width="1600" height="900" fill="url(#grain)" opacity=".5"/>
  <rect width="1600" height="900" fill="none" stroke="#000" stroke-opacity="0"/>
</svg>