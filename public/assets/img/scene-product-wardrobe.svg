<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332B24"/>
      <stop offset="100%" stop-color="#191612"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3826"/>
      <stop offset="100%" stop-color="#130F0C"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A231C"/>
      <stop offset="100%" stop-color="#1A1612"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A6B42" stop-opacity=".5"/>
      <stop offset="42%" stop-color="#3E3328" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#241C14" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#EFD3A0" stop-opacity=".4"/>
      <stop offset="55%" stop-color="#C49554" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#171412" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="920" fill="#171412"/>
  <rect width="1200" height="920" fill="url(#lamp)"/>
  <rect y="650" width="1200" height="270" fill="url(#floor)"/>

  <!-- wardrobe block -->
  <g transform="translate(210 130)">
    <rect x="0" y="0" width="780" height="520" rx="4" fill="url(#cab)"/>
    <rect x="0" y="0" width="780" height="520" rx="4" fill="none" stroke="#C9A05F" stroke-opacity=".28" stroke-width="2"/>

    <!-- anthracite profile frame -->
    <g stroke="#151210" stroke-width="6" fill="none">
      <rect x="20" y="20" width="352" height="478"/>
      <rect x="388" y="20" width="372" height="478"/>
    </g>

    <!-- bronze glass doors -->
    <rect x="24" y="24" width="344" height="470" fill="url(#glass)"/>
    <rect x="392" y="24" width="364" height="470" fill="url(#glass)"/>

    <!-- bronze handles -->
    <g fill="#C9A05F">
      <rect x="196" y="220" width="8" height="110" rx="4"/>
      <rect x="564" y="220" width="8" height="110" rx="4"/>
    </g>

    <!-- interior glow: hanging garments silhouettes + warm light -->
    <g fill="#2A231C">
      <path d="M120 120 L152 88 L268 88 L300 120 Z"/>
      <path d="M470 120 L502 88 L610 88 L642 120 Z"/>
      <path d="M180 122 L180 430 L150 430 L150 122 Z" fill="#262015"/>
      <path d="M520 122 L520 420 L492 420 L492 122 Z" fill="#262015"/>
      <path d="M238 122 L238 400 L212 400 L212 122 Z" fill="#2E271B" opacity=".85"/>
    </g>
    <circle cx="200" cy="620" r="120" fill="#EFD3A0" opacity=".05"/>

    <g stroke="#C9A05F" stroke-opacity=".5" stroke-width="2">
      <line x1="90"  y1="120" x2="90"  y2="520"/>
      <line x1="1150"  y1="120" x2="1150" y2="520" opacity="0"/>
    </g>
  </g>

  <!-- bench under the window -->
  <g transform="translate(210 650)">
    <rect x="0" y="0" width="340" height="34" rx="3" fill="#8A6B3A"/>
    <g stroke="#1A150F" stroke-width="12">
      <line x1="40" y1="34" x2="40" y2="110"/>
      <line x1="300" y1="34" x2="300" y2="110"/>
    </g>
    <ellipse cx="170" cy="118" rx="210" ry="14" fill="#000" opacity=".5"/>
  </g>

  <!-- floor lamp -->
  <g transform="translate(1040 520)">
    <line x1="40" y1="0" x2="40" y2="200" stroke="#16130F" stroke-width="5"/>
    <path d="M22 0 L58 0 L48 24 L32 24 Z" fill="#C9A05F" fill-opacity=".9"/>
    <circle cx="40" cy="0" r="70" fill="#EFD3A0" opacity=".2"/>
    <ellipse cx="40" cy="206" rx="28" ry="6" fill="#000" opacity=".5"/>
  </g>

  <rect width="1200" height="920" fill="url(#grain)" opacity=".5"/>
</svg>