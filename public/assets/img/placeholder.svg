<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="prodSpot" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#6E4B2F" stop-opacity=".55"/>
      <stop offset="48%" stop-color="#2A241D" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#131110" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorProd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221E19"/>
      <stop offset="100%" stop-color="#0F0D0C"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E352B"/>
      <stop offset="52%" stop-color="#2A241C"/>
      <stop offset="100%" stop-color="#1E1914"/>
    </linearGradient>
    <filter id="grainProd">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#171412"/>
  <rect width="800" height="600" fill="url(#prodSpot)"/>
  <rect y="430" width="800" height="170" fill="url(#floorProd)"/>
  <rect y="424" width="800" height="7" fill="#4A3420" opacity=".55"/>

  <!-- chest of drawers -->
  <g transform="translate(270 150)">
    <rect x="0" y="0" width="260" height="300" rx="5" fill="url(#unit)"/>
    <rect x="0" y="0" width="260" height="300" rx="5" fill="none" stroke="#8A6B42" stroke-opacity=".28" stroke-width="2"/>
    <!-- drawers -->
    <rect x="18" y="22" width="224" height="58" rx="3" fill="#2E271E"/>
    <rect x="18" y="96" width="224" height="58" rx="3" fill="#342C22"/>
    <rect x="18" y="170" width="224" height="58" rx="3" fill="#3A3125"/>
    <rect x="18" y="244" width="224" height="40" rx="3" fill="#2E271E"/>
    <!-- handles -->
    <rect x="80" y="44" width="100" height="5" rx="2" fill="#C9A878" opacity=".85"/>
    <rect x="80" y="118" width="100" height="5" rx="2" fill="#C9A878" opacity=".85"/>
    <rect x="80" y="192" width="100" height="5" rx="2" fill="#C9A878" opacity=".85"/>
  </g>

  <!-- legs -->
  <g transform="translate(270 450)">
    <rect x="18" y="0" width="14" height="56" rx="3" fill="#1B1814"/>
    <rect x="228" y="0" width="14" height="56" rx="3" fill="#1B1814"/>
    <ellipse cx="400" cy="66" rx="210" ry="14" fill="#000" opacity=".45"/>
  </g>

  <!-- decorative vase -->
  <g transform="translate(600 330)">
    <path d="M20 0 C26 20 34 70 34 118 C34 148 32 188 30 214 L10 214 C8 188 6 148 6 118 C6 70 14 20 20 0 Z" fill="#7A5634" opacity=".85"/>
    <ellipse cx="20" cy="198" rx="16" ry="5" fill="#000" opacity=".3"/>
  </g>

  <rect width="800" height="600" fill="url(#grainProd)" opacity=".5"/>
</svg>