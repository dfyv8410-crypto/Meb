<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1024" viewBox="0 0 820 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4E3826"/>
      <stop offset="55%" stop-color="#3A2919"/>
      <stop offset="100%" stop-color="#241810"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C4329"/>
      <stop offset="50%" stop-color="#4A3420"/>
      <stop offset="100%" stop-color="#332413"/>
    </linearGradient>
    <radialGradient id="lamp" cx="46%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#8A6B42" stop-opacity=".5"/>
      <stop offset="55%" stop-color="#3A2919" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35 0.012" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.28 0 0 0 0 0.19 0 0 0 0 0.10 0 0 0 0.55 0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="820" height="1024" fill="url(#base)"/>
  <rect width="820" height="1024" fill="url(#lamp)"/>

  <g>
