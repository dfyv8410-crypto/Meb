<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1024" viewBox="0 0 820 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A5A33"/>
      <stop offset="14%" stop-color="#C9A05F"/>
      <stop offset="26%" stop-color="#8A683A"/>
      <stop offset="40%" stop-color="#DFB97B"/>
      <stop offset="54%" stop-color="#9A7442"/>
      <stop offset="68%" stop-color="#CBAA70"/>
      <stop offset="82%" stop-color="#7E6038"/>
      <stop offset="100%" stop-color="#5E4626"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#F3DDB0" stop-opacity=".5"/>
      <stop offset="45%" stop-color="#C9A05F" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210" stop-opacity="0"/>
      <stop offset="80%" stop-color="#141210" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141210" stop-opacity=".7"/>
    </linearGradient>
    <filter id="brushed" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.5" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.42 0 0 0 0 0.25 0 0 0 0.3 0"/>
      <feBlend mode="overlay" in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="820" height="1024" fill="url(#metal)"/>
  <rect width="820" height="1024" fill="url(#lamp)"/>
  <rect width="820" height="1024" fill="url(#brushed)"/>

  <g stroke="#FFF6DD" stroke-width="1.6" stroke-opacity=".22">
    <line x1="0" y1="180"  x2="820" y2="180"/>
    <line x1="0" y1="380"  x2="820" y2="380"/>
    <line x1="0" y1="560"  x2="820" y2="560"/>
    <line x1="0" y1="780"  x2="820" y2="780"/>
  </g>
  <g stroke="#3A2C16" stroke-width="1.6" stroke-opacity=".34">
    <line x1="0" y1="230"  x2="820" y2="230"/>
    <line x1="0" y1="452"  x2="820" y2="452"/>
    <line x1="0" y1="660"  x2="820" y2="660"/>
    <line x1="0" y1="900"  x2="820" y2="900"/>
  </g>

  <rect width="820" height="1024" fill="url(#edge)"/>
</svg>